name: Build and Publish Rust Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + nightly for Miri)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Miri toolchain
        run: |
          rustup toolchain install nightly --component miri

      - name: Run Miri (undefined behaviour check on NIF scoring logic)
        # --no-default-features disables the cdylib/NIF feature so Miri can
        # analyse the pure scoring code without FFI entrypoints.
        # -Zmiri-strict-provenance: catches raw-pointer provenance bugs that
        # could create Use-After-Free at the Rust/BEAM FFI boundary.
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        run: cargo +nightly miri test --no-default-features --lib --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build image (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          tags: |
            ghcr.io/quetzalcoutl/theragraph-rust:${{ github.sha }}

      - name: Output image tag
        run: |
          echo "image: ghcr.io/quetzalcoutl/theragraph-rust:${{ github.sha }}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Log in to GHCR (using built-in GITHUB_TOKEN)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/quetzalcoutl/theragraph-rust:${{ github.sha }}
            ghcr.io/quetzalcoutl/theragraph-rust:latest

      - name: Output image tags
        run: |
          echo "image: ghcr.io/quetzalcoutl/theragraph-rust:${{ github.sha }}"
