[package]
name = "theragraph"
version = "0.2.0"
edition = "2021"
description = "TheraGraph blockchain indexer and recommendation engine"
authors = ["TheraGraph Team"]
license = "MIT"
repository = "https://github.com/theragraph/theragraph-rust"
rust-version = "1.95"

[lib]
name = "theragraph"
path = "src/lib.rs"
# cdylib: needed by Rustler to produce a loadable .so/.dylib NIF
# rlib:   preserves the normal Rust library for tests and binary targets
crate-type = ["cdylib", "rlib"]


[dependencies]
# Async runtime - tokio with all features for production
tokio = { version = "1.35", features = ["full", "tracing"] }
# RS-03: TaskTracker lives in tokio_util::task (part of the rt feature).
tokio-util = { version = "0.7", features = ["rt"] }

# Ethereum - ethers with websocket support and TLS
ethers = { version = "2.0", features = ["ws", "rustls"] }
ethers-providers = "2.0"
ethers-core = "2.0"

# Kafka - with SSL/SASL for secure connections
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }

# Database - sqlx with connection pooling and migrations
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Web framework - axum with full features
axum = { version = "0.7", features = ["json", "query", "tracing", "macros"] }
tower = { version = "0.4", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression-gzip", "request-id", "limit", "normalize-path"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client — 0.12 uses hyper 1.x, matching axum 0.7 (DEP-01: eliminates split hyper 0.14+1.x dep tree)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.14", optional = true }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Environment and configuration
dotenvy = "0.15"
config = "0.14"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
rand = "0.8"
once_cell = "1.19"
tempfile = "3.8"

# Andrew Gallant + Niko Matsakis: Rayon for data parallelism
rayon = "1.8"

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.13", features = ["http-listener"] }

# Graceful shutdown
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"
log = "0.4.29"

# ── ERC-4337 Bundler (Alloy + Axum + Tokio) ──────────────────────────────────
# Ethereum stack for bundler (Alloy — Foundry ecosystem, best-in-class Rust Ethereum)
alloy = { version = "0.8", features = [
    "full", "provider-http", "signer-local", "sol-types",
    "contract", "network", "rpc-types", "consensus", "eips",
] }

# Bundler receipt store — Redis for production, DashMap fallback
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "aio"] }
dashmap = "6"
lru = "0.12"

# RS-04: moka replaces the LruCache + outer AsyncMutex compute_locks bottleneck.
# Sharded concurrent map with get_with() atomic get-or-insert — no outer lock needed.
moka = { version = "0.12", features = ["future"] }

# Error handling for bundler module (eyre — zero-cost, ergonomic)
eyre = "0.6"

# Byte utilities
bytes = "1"

# Rustler NIF: exposes pure-computation scoring + post-quantum crypto to the BEAM.
# Loading is gated by otp_app, so it's a no-op unless the BEAM loads the shared lib.
rustler = { version = "0.33", optional = true }

# Post-quantum cryptography — ML-DSA-65 (NIST FIPS 204 final standard)
# PQClean-backed pure-Rust bindings; no external liboqs needed.
# NOTE: pqcrypto-dilithium is NIST Round 3 (incompatible encoding with FIPS 204).
#       Client signs with @noble/post-quantum ml_dsa65 (FIPS 204) — must match.
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

# Base64 encoding/decoding for HTTP crypto endpoints
base64 = "0.22"

# TA-01: constant-time byte comparison to prevent timing attacks on secret headers.
subtle = "2"

[features]
# nif must be explicitly enabled when building the NIF (Mix/Rustler passes --features nif).
# By default the standalone binary does NOT link against ERTS, so _enif_* symbols are absent.
default = []
nif = ["rustler"]
telemetry = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp"]
full = ["telemetry"]

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
testcontainers = "0.15"
tempfile = "3.8"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false
