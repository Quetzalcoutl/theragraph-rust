[package]
name = "theragraph"
version = "0.2.0"
edition = "2021"
description = "TheraGraph blockchain indexer and recommendation engine"
authors = ["TheraGraph Team"]
license = "MIT"
repository = "https://github.com/theragraph/theragraph-rust"
rust-version = "1.95"

[lib]
name = "theragraph"
path = "src/lib.rs"
# cdylib: needed by Rustler to produce a loadable .so/.dylib NIF
# rlib:   preserves the normal Rust library for tests and binary targets
crate-type = ["cdylib", "rlib"]


[dependencies]
# Async runtime - tokio with all features for production
tokio = { version = "1", features = ["full", "tracing"] }
# RS-03: TaskTracker lives in tokio_util::task (part of the rt feature).
tokio-util = { version = "0.7", features = ["rt"] }

# Ethereum stack — alloy only (see bundler section below; ethers removed 2026-09-02)

# Kafka - with SSL/SASL for secure connections
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "sasl"] }

# Database - sqlx with connection pooling and migrations
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "chrono", "uuid", "migrate"] }

# Web framework - axum with full features
axum = { version = "0.8", features = ["json", "query", "tracing", "macros"] }
tower = { version = "0.5", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "compression-gzip", "request-id", "limit", "normalize-path"] }

# Serialization
# "rc" feature: Serialize/Deserialize for Arc<T>/Rc<T> — needed for the tag
# interner (ScoredNft/ScoringFeatures tags are Arc<str> so repeated tags across
# NFTs share one allocation instead of each holding its own Box<str> copy).
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# toml removed — not used in src/ (1.1 available)

reqwest = { version = "0.13", features = ["json", "rustls"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.22", optional = true }  # 0.33 available — skip: OTEL API 0.32 breaking, revisit with telemetry feature
opentelemetry = { version = "0.21", optional = true }  # 0.32 available — guarded by telemetry feature
opentelemetry-otlp = { version = "0.14", optional = true }  # 0.32 available — guarded by telemetry feature

# Error handling
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"

# Environment and configuration
dotenvy = "0.15"
# config = "0.14" removed — not used; our own src/config/ module shadows the crate name

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
rand = "0.10"
# once_cell removed — migrated to std::sync::LazyLock (stable since 1.80, we target 1.95)
tempfile = "3.8"

# Andrew Gallant + Niko Matsakis: Rayon for data parallelism
rayon = "1.8"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", features = ["http-listener"] }

# Graceful shutdown — uses tokio::signal directly; signal-hook not needed
futures = "0.3"
log = "0.4.29"

# ── ERC-4337 Bundler (Alloy + Axum + Tokio) ──────────────────────────────────
# Ethereum stack for bundler (Alloy — Foundry ecosystem, best-in-class Rust Ethereum)
alloy = { version = "2.4", features = [
    "full", "provider-http", "signer-local", "sol-types",
    "contract", "network", "rpc-types", "consensus", "eips",
] }

# Bundler receipt store — Redis for production, DashMap fallback
redis = { version = "1.6", features = ["tokio-comp", "connection-manager", "aio"] }
dashmap = "6"

# RS-04: moka replaces the LruCache + outer AsyncMutex compute_locks bottleneck.
# Sharded concurrent map with get_with() atomic get-or-insert — no outer lock needed.
moka = { version = "0.12", features = ["future"] }

# Error handling for bundler module (eyre — zero-cost, ergonomic)
eyre = "0.6"

# Byte utilities
bytes = "1"

# Rustler NIF: exposes pure-computation scoring + post-quantum crypto to the BEAM.
# Loading is gated by otp_app, so it's a no-op unless the BEAM loads the shared lib.
rustler = { version = "0.38", optional = true }

# Post-quantum cryptography — ML-DSA-65 (NIST FIPS 204 final standard)
# PQClean-backed pure-Rust bindings; no external liboqs needed.
# NOTE: pqcrypto-dilithium is NIST Round 3 (incompatible encoding with FIPS 204).
#       Client signs with @noble/post-quantum ml_dsa65 (FIPS 204) — must match.
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

# Base64 encoding/decoding for HTTP crypto endpoints
base64 = "0.23"

# TA-01: constant-time byte comparison to prevent timing attacks on secret headers.
subtle = "2"
rmp-serde = "1.3.1"

[features]
# nif must be explicitly enabled when building the NIF (Mix/Rustler passes --features nif).
# By default the standalone binary does NOT link against ERTS, so _enif_* symbols are absent.
default = []
nif = ["rustler"]
telemetry = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp"]
full = ["telemetry"]

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
testcontainers = "0.28"
tempfile = "3.8"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false
